name: Paper books and 1-minute advisor

# One run every ~15 minutes on GitHub's servers, so the paper record keeps going while the laptop is off (cloud.py):
# step the books, let the advisor catch up on every closed 1-minute candle and learn, then publish the website.
# State (two small SQLite files) lives on the 'state' branch, replaced on every run. Paper only: there is no API key.
on:
  # Main trigger (from 2026-11-20): an external timer (cron-job.org) POSTs every 15 min to
  #   https://api.github.com/repos/rishiwork7-lab/btc-eth-paper/actions/workflows/cloud.yml/dispatches  body {"ref":"main"}
  # with a fine-grained token limited to this repository (Actions: read and write). The schedule below is only a backup.
  # GitHub starts scheduled runs late under load (seen: gaps of 40-120 min, not 15), and round minutes are the most delayed.
  # The advisor does not mind (each run catches up on every missed candle). The Friday 18:00 UTC condor entry does: any run
  # that starts between 17:00 and 18:12 UTC stays up through it, so Fridays get several extra chances in that hour.
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '2,12,17,27,32,42,47,57 17 * * 5'    # with the line above: a chance every 5 min, 17:02-18:07 UTC
    - cron: '2 18 * * 5'
  workflow_dispatch:

permissions:
  contents: write              # push the state branch
  pages: write
  id-token: write

concurrency:
  group: cloud                 # one run at a time: each run continues from the previous run's state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80        # a Friday run can stay up from 17:00 to 18:12 UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore state
        run: |
          git fetch -q --depth=1 origin state
          git checkout origin/state -- data advisor
          git reset -q
      - name: Books, advisor, website
        run: python cloud.py
      - name: Save state
        run: |
          mkdir -p "$RUNNER_TEMP/state/data" "$RUNNER_TEMP/state/advisor"
          cp data/scalper.sqlite "$RUNNER_TEMP/state/data/"
          cp advisor/advisor.sqlite "$RUNNER_TEMP/state/advisor/"
          cd "$RUNNER_TEMP/state"
          git init -q -b state
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "State $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
