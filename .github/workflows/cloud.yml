name: Paper books and 1-minute advisor

# One run every ~15 minutes on GitHub's servers, so the paper record keeps going while the laptop is off (cloud.py):
# step the books, let the advisor catch up on every closed 1-minute candle and learn, then publish the website.
# State (two small SQLite files) lives on the 'state' branch, replaced on every run. Paper only: there is no API key.
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '20 17 * * 5'      # Friday 17:20 UTC: one more chance to be up for the 18:00 UTC condor entry
  workflow_dispatch:

permissions:
  contents: write              # push the state branch
  pages: write
  id-token: write

concurrency:
  group: cloud                 # one run at a time: each run continues from the previous run's state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80        # a Friday run can stay up from 17:00 to 18:12 UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore state
        run: |
          git fetch -q --depth=1 origin state
          git checkout origin/state -- data advisor
          git reset -q
      - name: Books, advisor, website
        run: python cloud.py
      - name: Save state
        run: |
          mkdir -p "$RUNNER_TEMP/state/data" "$RUNNER_TEMP/state/advisor"
          cp data/scalper.sqlite "$RUNNER_TEMP/state/data/"
          cp advisor/advisor.sqlite "$RUNNER_TEMP/state/advisor/"
          cd "$RUNNER_TEMP/state"
          git init -q -b state
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "State $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
